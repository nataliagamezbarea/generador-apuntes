services:
  generador:
    build:
      context: ..
      dockerfile: docker/Imagen
    container_name: generador-apuntes
    ports:
      - "127.0.0.1:${PUERTO_WEB:-8000}:8000"
    environment:
      PORT: 8000
      RUTA_APUNTES_CONTENEDOR: /data/apuntes-privados
      RUTA_INFORMES_GENERACION: /data/informes-generacion
      RUTA_BIBLIOTECA_CONTENEDOR: /data/bibliotecas_latex
      BIBLIOTECA_LATEX_GITHUB: "${BIBLIOTECA_LATEX_GITHUB:-https://github.com/nataliagamezbarea/apuntes-latex}"
      DIRECCION_OLLAMA: http://ollama:11434
      MODELO_IA: ${MODELO_IA:-qwen2.5vl:7b}
      MODELO_CODIGO: ${MODELO_CODIGO:-qwen2.5vl:7b}
      TIEMPO_IA: ${TIEMPO_IA:-1800}
      TOKENS_MAX_IA: ${TOKENS_MAX_IA:--1}
      NUM_CTX_IA: ${NUM_CTX_IA:-28672}
      CONCURRENCIA_IA: ${CONCURRENCIA_IA:-1}
      MAX_MB_SUBIDA: ${MAX_MB_SUBIDA:-512}
      MAX_ARCHIVOS_SUBIDA: ${MAX_ARCHIVOS_SUBIDA:-300}
      MAX_MB_ZIP: ${MAX_MB_ZIP:-256}
      MAX_PAGINAS_VISION: ${MAX_PAGINAS_VISION:-8}
    volumes:
      - ${RUTA_APUNTES:-../../apuntes-privados}:/data/apuntes-privados
      - ${RUTA_INFORMES_GENERACION:-../informes-generacion}:/data/informes-generacion
      - ${RUTA_BIBLIOTECA_LATEX:-../bibliotecas_latex}:/data/bibliotecas_latex:ro
      - ../js:/app/js:ro
      - ../css:/app/css:ro
      - ../interfaz:/app/interfaz:ro
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: generador-apuntes-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_NUM_PARALLEL: ${CONCURRENCIA_IA:-1}
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
