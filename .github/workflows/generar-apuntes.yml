name: Generar Apuntes con IA y LaTeX

on:
  workflow_dispatch:
    inputs:
      asignatura:
        description: "Nombre de la asignatura (ej: WEC, SOR)"
        required: true
        default: "WEC"
      tema:
        description: "Número de tema (ej: 1, 2)"
        required: true
        default: "1"
      titulo:
        description: "Título del tema"
        required: false
        default: ""
      subtema:
        description: "Número de apartado o subtema"
        required: false
        default: "0"
      instrucciones:
        description: "Instrucciones adicionales para la IA"
        required: false
        default: ""
      texto_fuente:
        description: "Texto o resumen fuente para generar"
        required: false
        default: ""
      nvidia_api_key:
        description: "Clave de NVIDIA NIM (leída de Supabase)"
        required: false
        default: ""
      nvidia_modelo:
        description: "Modelo de NVIDIA NIM para teoría (ej: nvidia/nemotron-3.5-bolt-e4b)"
        required: false
        default: ""
      nvidia_modelo_codigo:
        description: "Modelo de NVIDIA NIM para código y sintaxis (ej: nvidia/nemotron-3.5-bolt-e4b)"
        required: false
        default: ""
      contenido_latex:
        description: "Código LaTeX ya generado y aprobado desde el frontend"
        required: false
        default: ""
      gh_token:
        description: "Token de GitHub (gh_token_general de Supabase)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ inputs.gh_token || secrets.GH_TOKEN_GENERAL || secrets.GH_TOKEN || github.token }}

      - name: Validar secreto o variable NVIDIA_API_KEY
        if: ${{ inputs.contenido_latex == '' }}
        run: |
          if [ -z "${{ inputs.nvidia_api_key }}" ] && [ -z "${{ secrets.NVIDIA_API_KEY }}" ] && [ -z "${{ vars.NVIDIA_API_KEY }}" ]; then
            echo "::error title=Falta NVIDIA_API_KEY::No se configuró la variable o secreto NVIDIA_API_KEY en Supabase ni en GitHub Actions."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Caché de paquetes LaTeX (.deb)
        uses: actions/cache@v4
        with:
          path: /tmp/texlive-debs
          key: ${{ runner.os }}-texlive-debs-v1
          restore-keys: |
            ${{ runner.os }}-texlive-debs-

      - name: Preparar bibliotecas LaTeX
        run: |
          if [ ! -d "bibliotecas_latex/estilo" ]; then
            echo "Descargando bibliotecas_latex oficiales..."
            git clone --depth 1 https://github.com/nataliagamezbarea/apuntes-latex.git /tmp/apuntes-latex 2>/dev/null || true
            if [ -d "/tmp/apuntes-latex/bibliotecas_latex" ]; then
              cp -r /tmp/apuntes-latex/bibliotecas_latex ./
              echo "✓ bibliotecas_latex listas en el workspace."
            fi
          fi

      - name: Compilar apuntes LaTeX e instalar XeLaTeX en paralelo
        env:
          PROVEEDOR_IA: "nvidia"
          NVIDIA_API_KEY: ${{ inputs.nvidia_api_key || secrets.NVIDIA_API_KEY || vars.NVIDIA_API_KEY }}
          NVIDIA_MODELO: ${{ inputs.nvidia_modelo || vars.NVIDIA_MODELO || 'nvidia/nemotron-3.5-bolt-e4b' }}
          NVIDIA_MODELO_CODIGO: ${{ inputs.nvidia_modelo_codigo || 'nvidia/nemotron-3.5-bolt-e4b' }}
          ASIGNATURA: ${{ inputs.asignatura }}
          TEMA: ${{ inputs.tema }}
          TITULO: ${{ inputs.titulo }}
          SUBTEMA: ${{ inputs.subtema }}
          INSTRUCCIONES: ${{ inputs.instrucciones }}
          TEXTO_FUENTE: ${{ inputs.texto_fuente }}
          CONTENIDO_LATEX: ${{ inputs.contenido_latex }}
        run: |
          echo "⚡ Iniciando instalación de LaTeX en segundo plano..."
          (
            if [ -d "/tmp/texlive-debs" ] && ls /tmp/texlive-debs/*.deb >/dev/null 2>&1; then
              echo "✓ Restaurando paquetes LaTeX desde la caché de GitHub Actions..."
              sudo cp -n /tmp/texlive-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            fi
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              texlive-latex-base \
              texlive-latex-recommended \
              texlive-latex-extra \
              texlive-fonts-recommended \
              texlive-xetex \
              texlive-lang-spanish \
              latexmk
            mkdir -p /tmp/texlive-debs
            sudo cp -n /var/cache/apt/archives/*.deb /tmp/texlive-debs/ 2>/dev/null || true
            touch /tmp/latex_listo
            echo "✓ Instalación de LaTeX completada."
          ) > /tmp/texlive_install.log 2>&1 &
          echo $! > /tmp/texlive_pid

          echo "🚀 Estructurando archivos modulares y compilando con XeLaTeX..."
          node scripts/generar-desde-ci.js

      - name: Publicar apuntes EXCLUSIVAMENTE en GRADOS_INFORMATICOS
        if: success()
        env:
          GH_TOKEN: ${{ inputs.gh_token || secrets.GH_TOKEN_GENERAL || secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Falta GH_TOKEN::No se proporcionó token de GitHub para publicar en GRADOS_INFORMATICOS."
            exit 1
          fi

          # Limpiar archivos auxiliares de LaTeX (.aux, .out, .log, etc.)
          find apuntes-generados -type f ! -name "*.pdf" ! -name "*.tex" -delete || true

          echo "Clonando repositorio privado GRADOS_INFORMATICOS..."
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/nataliagamezbarea/GRADOS_INFORMATICOS.git" /tmp/grados_repo
          cd /tmp/grados_repo

          # Usar rama Segundo_grado_superior si existe, o master
          git checkout Segundo_grado_superior 2>/dev/null || git checkout master 2>/dev/null || true

          mkdir -p "apuntes_privados/${{ inputs.asignatura }}"
          mkdir -p "apuntes/${{ inputs.asignatura }}"

          cp -r $GITHUB_WORKSPACE/apuntes-generados/${{ inputs.asignatura }}/* "apuntes_privados/${{ inputs.asignatura }}/" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/apuntes-generados/${{ inputs.asignatura }}" -type f -name "*.pdf" -exec cp {} "apuntes/${{ inputs.asignatura }}/" \;

          git config user.name "Generador Apuntes Bot"
          git config user.email "bot@generador-apuntes.local"
          git add apuntes_privados/ apuntes/

          if ! git diff --staged --quiet; then
            git commit -m "docs(apuntes): apuntes generados para ${{ inputs.asignatura }} - Tema ${{ inputs.tema }}"
            git push origin HEAD
            echo "✓ Apuntes publicados con éxito EXCLUSIVAMENTE en GRADOS_INFORMATICOS."
          else
            echo "Sin cambios nuevos para publicar en GRADOS_INFORMATICOS."
          fi

      - name: Subir PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apuntes-${{ inputs.asignatura }}-tema-${{ inputs.tema }}
          path: |
            apuntes-generados/**/*.pdf
            apuntes-generados/**/*.tex
          if-no-files-found: warn
